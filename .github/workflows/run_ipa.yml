name: Download and run IPA

# Manually-triggered workflow that downloads an `.ipa` (or zipped `.app`) from a
# provided URL, builds touchHLE for Linux, and runs the app under touchHLE.
#
# touchHLE normally opens a window and runs the app indefinitely, neither of
# which suits CI, so the run is performed:
#   * under a virtual framebuffer (xvfb) so SDL has a display to draw into, and
#   * wrapped in `timeout` so the job finishes after a bounded number of seconds.
# A non-zero exit purely caused by hitting that timeout is treated as success —
# it just means the app was still running, which is the expected outcome.

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct download link to the .ipa (or .app .zip) to run
        type: string
        required: true
      run_seconds:
        description: How long to let the app run before stopping it (seconds)
        type: string
        required: false
        default: "60"
      extra_args:
        description: Extra arguments to pass to touchHLE (e.g. "--scale-hack=2")
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-ipa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Install Linux build and runtime dependencies
        # SDL2 and openal-soft are built from source, so the development headers
        # for the audio, video and input backends they detect must be available.
        # `xvfb` provides a headless X server to run the GUI under.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            xvfb

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build touchHLE
        run: cargo build --release

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p downloaded_app
          echo "Downloading IPA from: $IPA_URL"
          # `-f` makes curl fail (non-zero exit) on HTTP errors instead of
          # silently saving an error page as "app.ipa".
          curl -fL --retry 4 --retry-delay 2 -o downloaded_app/app.ipa "$IPA_URL"
          ls -lh downloaded_app/app.ipa
          file downloaded_app/app.ipa || true

      - name: Inspect app bundle
        run: ./target/release/touchHLE downloaded_app/app.ipa --info

      - name: Run app under touchHLE
        env:
          RUN_SECONDS: ${{ inputs.run_seconds }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -uo pipefail
          echo "Running app for up to ${RUN_SECONDS}s..."
          # `timeout` returns 124 when it has to kill the still-running app,
          # which is the normal, expected case here, so don't treat that (or the
          # SIGTERM-induced 143) as a failure.
          set +e
          xvfb-run -a --server-args="-screen 0 640x960x24" \
            timeout --signal=TERM "${RUN_SECONDS}" \
            ./target/release/touchHLE downloaded_app/app.ipa \
              --no-error-popup ${EXTRA_ARGS} 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "touchHLE exited with status ${status}"
          if [ "${status}" -eq 0 ] || [ "${status}" -eq 124 ] || [ "${status}" -eq 143 ]; then
            echo "App ran successfully (stopped after reaching the time limit or exited cleanly)."
            exit 0
          fi
          echo "App exited with an unexpected error status."
          exit "${status}"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: touchHLE_run_log
          path: run.log
          if-no-files-found: ignore
